services:
  db:
    image: pgvector/pgvector:pg16
    container_name: krishimitra-db
    environment:
      POSTGRES_DB: krishimitra
      POSTGRES_USER: krishimitra
      POSTGRES_PASSWORD: krishimitra_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishimitra -d krishimitra"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
